# 依赖与 CI action 的更新跟踪。
#
# 第三方 action 用的是可移动的大版本标签（`actions/checkout@v4`），所以更新交给 Dependabot
# 以 PR 形式提出，标签保持可读；能否合入由 CI 判定。
#
# 它只提 PR，不自动合并。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"
