# dsh-quake-alert · CI 契约测试
#
# 这个 workflow 只做一件事：跑 scripts/check-contracts.mjs，把真实的上游数据交给解析器，
# 看它还认不认。它是唯一能在上游改版当天发现问题的入口——其余测试都基于 samples/ 的快照，
# 而上游改版时快照不会变。
#
# 定时任务有意不开：契约漂移不是急事，而上游网络抖动会让定时跑批发出无信息量的失败邮件。
# 要开的话取消下面 schedule 的注释即可，其余不用动：
#
#   schedule:
#     - cron: '0 22 * * *'    # 每天 07:00 JST 一次

name: contracts

permissions:
  contents: read

on:
  # 手动触发：唯一会跑真实网络的场景（见下面在线检查那一步的 if）
  workflow_dispatch:
  # PR：只跑离线自检，不联网
  pull_request:
  # 直推主分支也要过一遍
  push:
    branches: [main]

# 同一分支的旧跑批自动让位，避免连续推送时排队堆积
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 零依赖 job：只用 Node 内置的 vm / fs / path / fetch / WebSocket。
  # 它读的是已提交的 client/client.js，所以不需要 rollup、不需要装包。
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 与 package.json 的 engines（>=22.19.0）对齐：全局 WebSocket 与 fetch 都要它
          node-version: '22.19.0'

      # 跨模块引用检查（零依赖）：未声明的赋值、循环依赖、导出名漂移。
      - name: 跨模块引用检查
        run: node scripts/check-imports.mjs

      # 回归套件与时钟前移检查不在这里：它们会 `await import('lib/index.js')`，
      # 而那个文件顶层 import 了 @deepseek-ai/schemastery。见下面的 regression job。

      # 离线自检：只用 samples/ 的快照。样本是刻意挑的有效数据，所以这里必须全通过
      # ——它验的是"脚本与解析器还接得上"。任何一条解析不出 Alert 都说明 fixture 名写错 /
      # 解析入口改了名 / client bundle 陈旧，这些都是 PR 该当场拦下的。
      - name: 离线契约自检（不联网）
        run: node scripts/check-contracts.mjs --offline

      # 在线检查：真实拉取 10 个源，只在手动触发时跑——PR 上跑会把上游的网络抖动变成
      # 与改动无关的红灯。只有 schema / value（上游改版）会让它失败，网络不可达只记 skip。
      - name: 在线契约检查（真实拉取 10 个源）
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/check-contracts.mjs

  # 回归套件 + 时钟前移检查 + bundle 同步检查。
  #
  # 这个 job 需要依赖：tests/sync-test.cjs 里有 Host 侧断言，会
  # `await import('lib/index.js')`，而 lib/index.js 顶层 `import z from '@deepseek-ai/schemastery'`。
  # 零依赖的 job 里没有 node_modules，那句 import 直接抛错，整个套件在几秒内崩掉。
  #
  # 与上面的 contracts job 分开是为了让红灯可归因：这里的红灯只可能是
  # 「回归断言 / 时钟前移检查 / bundle 不同步」。
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
          cache: 'pnpm'

      - name: 安装依赖（runtime + rollup）
        run: pnpm install --frozen-lockfile

      # 核心回归套件。
      # 不要把 TZ 固定成 Asia/Tokyo：runner 的默认 UTC 是「测试依赖本机时区」这类问题的守卫。
      - name: 核心回归套件
        # 失败行同时写进 job summary：Actions 的完整日志要登录才能看（未登录时页面只显示
        # "Sign in to view logs"，API 的 /logs 也要求 admin），而 check-run 的 summary 匿名可读。
        run: |
          node tests/sync-test.cjs > regression.log 2>&1
          status=$?
          cat regression.log
          if [ "$status" -ne 0 ]; then
            {
              echo '### 核心回归套件：失败行与结论'
              echo '```'
              grep -a -F '✗' regression.log | head -40 || true
              echo '--- 结论 ---'
              tail -3 regression.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      # 时钟前移检查：把宿主时钟整体前移 180 天，再跑一遍上面那套回归，抓的是把某个绝对
      # 时刻当成"现在"写死、却与真实时钟做差的断言（这类断言写下的当天全绿，之后某天开始红）。
      # 只前移宿主 Date 就够：沙箱里的 Date 由测试自己注入。
      - name: 时钟前移检查（宿主时钟 +180 天）
        run: node scripts/check-time-travel.cjs 180

      # --check 比较 src 的构建结果与已提交的 client/client.js，不一致即失败。
      # 注意它在 CRLF 检出上会假报"陈旧"（仓库根的 .gitattributes 正是为此而加）。
      - name: bundle 与 client/src 是否同步
        run: node scripts/build-client.mjs --check
